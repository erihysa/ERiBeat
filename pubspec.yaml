name: eribeat
description: ERIBeat music player with openly licensed audio and background playback.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'


dependencies:
  flutter:
    sdk: flutter
  youtube_explode_dart: ^2.3.10
  youtube_player_flutter: ^9.1.3
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  shared_preferences: ^2.5.3

  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
